<!DOCTYPE html>

<style>
  body { font-family: Inter, system-ui, sans-serif; margin: 0; padding: 16px;
         background: #fff; color: #111827; }
  @media (prefers-color-scheme: dark) {
    body { background: #1e1e1e; color: #f3f4f6; }

    button.page { background: #2a2a2a; color: #f3f4f6; }

  h2 { font-size: 16px; margin: 0 0 4px; color: #EA580C; }
  .note { font-size: 12px; color: #6b7280; margin: 0 0 12px; }
  .sect { font-size: 11px; font-weight: 700; color: #9ca3af; margin: 14px 0 4px;
          text-transform: uppercase; letter-spacing: .06em; }
  button { display: block; width: 100%; margin: 6px 0; padding: 10px;
           font-size: 14px; font-weight: 600; border: none; border-radius: 8px;

  button.page { background: #F3F4F6; color: #111827; font-weight: 500; text-align: left;
           padding: 9px 12px; }

  #status { font-size: 12px; margin-top: 10px; min-height: 32px; color: #059669; }
  #status.err { color: #DC2626; }
</style>

  <button class="page" id="test">🧪 Test: sample hero</button>
  <div id="status"></div>
  <script>
    const status = document.getElementById("status");
    function send(type, extra) {
      status.className = "";
      status.textContent = "Drawing…";
      parent.postMessage(Object.assign({ type: type }, extra || {}), "*");
    }
    document.querySelectorAll("button.page[data-page]").forEach((b) => {
      b.onclick = () => send("draw", { page: b.getAttribute("data-page") });
    });
    document.getElementById("newPage").onclick = () => send("new-page");
    document.getElementById("newPage5").onclick = () => send("new-page5");
    document.querySelectorAll("button.page[data-page5]").forEach((b) => {
      b.onclick = () => send("draw5", { page: b.getAttribute("data-page5") });
    });
    document.getElementById("test").onclick = () => send("test-hero");
    window.addEventListener("message", (e) => {
      const m = e.data;
      if (!m) return;
      if (m.type === "progress") {
        status.className = ""; status.textContent = "⏳ " + m.detail;
      } else if (m.type === "done") {
        status.className = m.ok ? "" : "err";
        status.textContent = (m.ok ? "✓ " : "✗ ") + m.detail;
      }
    });
  </script>
